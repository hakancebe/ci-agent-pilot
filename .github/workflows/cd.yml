name: CD

# ARTIK OTOMATİK KOŞMUYOR. Deploy job'ı ci.yml içine taşındı ve orada
# needs: ile test job'larına bağlandı. Sebep: workflow_run ile tetiklenen
# çalışmalar PR'ın Checks kutusunda hiç görünmüyor, GitHub onları her
# zaman varsayılan dala yazıyor. Bu dosya yalnızca elle tetikleme ve
# referans için duruyor.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish src/CiPilot.Api/CiPilot.Api.csproj -c Release -o publish

      - name: Build image
        run: docker build -t cipilot-api:${{ github.sha }} .

      - name: Start container
        # Uygulama bu değişken olmadan açılmıyor; bu bilinçli bir tercih
        # (eksik yapılandırmayla sessizce çalışmaktansa açılışta dursun).
        # Gerçek bir dağıtımda değer secrets'tan gelir:
        #   -e CIPILOT_CONNECTION_STRING="${{ secrets.CIPILOT_CONNECTION_STRING }}"
        # Burası pilot repo olduğu için sahte bir demo değeri veriliyor.
        run: |
          docker run -d --name cipilot-api -p 8080:8080 \
          -e CIPILOT_CONNECTION_STRING="Server=demo;Database=cipilot" \
            cipilot-api:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "Health check gecti."
              exit 0
            fi
            echo "deneme $i/10 - servis henuz yanit vermiyor, 2sn bekleniyor"
            sleep 2
          done

          echo "::error::Health check 20 saniye sonunda basarisiz oldu"
          echo "--- container durumu ---"
          docker ps -a --filter name=cipilot-api --format '{{.Names}}\t{{.Status}}'
          echo "--- container loglari ---"
          docker logs cipilot-api 2>&1 || true
          exit 1
